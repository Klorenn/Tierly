    :root {

      transform: scale(1.02); transition: transform 400ms ease;
    }
    .lb-games-hero:hover .lb-games-hero-img { transform: scale(1.05); }
    .lb-games-hero-shade {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(10,18,18,0.88) 0%, rgba(10,18,18,0.55) 48%, rgba(10,18,18,0.2) 100%);
    }
    .lb-games-hero-copy {
      position: relative; z-index: 1; max-width: 36rem; padding: clamp(22px, 4vw, 40px);
      color: #f4f7f6; display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
    }
    .lb-games-hero-badge {
      display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px;
      background: var(--teal-bright); color: #fff; font-size: 11px; font-weight: 800;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .lb-games-hero-copy h3 {
      font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.75rem); font-weight: 600;
      line-height: 1.1; letter-spacing: -0.03em; text-wrap: balance; color: #fff;
      text-shadow: 0 2px 18px rgba(0,0,0,0.35);
    }
    .lb-games-hero-copy p { font-size: 14.5px; color: rgba(244,247,246,0.9); }
    .lb-games-hero-hint { font-size: 13px !important; color: rgba(244,247,246,0.72) !important; max-width: 42ch; }
    .lb-disc-btn-light {
      margin-top: 8px; background: #fff; color: var(--teal-ink); border-color: transparent;
    }
    .lb-disc-btn-light:hover { background: #f0f4f3; }

    .lb-games-rail {
      display: grid; grid-auto-flow: column; grid-auto-columns: minmax(160px, 1fr);
      gap: 12px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .lb-games-rail-card {
      scroll-snap-align: start; border-radius: var(--radius-md); overflow: hidden;
      border: 1px solid var(--card-border); background: var(--card); box-shadow: var(--card-shadow);
      transition: transform 160ms ease, border-color 160ms ease;
      display: block; width: 100%; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer;
    }
    .lb-games-rail-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--teal-bright) 40%, var(--card-border)); }
    .lb-games-rail-card:focus-visible { outline: 3px solid var(--clay); outline-offset: 2px; }
    .lb-games-rail-media { position: relative; aspect-ratio: 16 / 9; background: var(--chip-bg); }
    .lb-games-rail-media img, .lb-games-rail-media .lb-game-banner-fallback {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .lb-games-rail-media .lb-game-banner-fallback {
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: 22px; color: #fff;
      background: linear-gradient(135deg, var(--teal-bright), var(--teal-deep));
    }
    .lb-games-rail-rank {
      position: absolute; top: 8px; left: 8px; min-width: 26px; height: 26px; padding: 0 7px;
      border-radius: 999px; background: rgba(26,46,47,0.82); color: #fff;
      font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
    }
    .lb-games-rail-body { padding: 10px 12px 12px; }
    .lb-games-rail-body h4 { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.2; }
    .lb-games-rail-body p { margin-top: 4px; font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

    @media (max-width: 720px) {
      .lb-games-hero { min-height: 240px; }
      .lb-games-rail { grid-auto-columns: minmax(148px, 70%); }
    }

    .lb-disc-crest { border-radius: 12px; object-fit: cover; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 600; background: var(--teal-bright); color: #fff; }
    .lb-disc-crest-sm { width: 30px; height: 30px; border-radius: 9px; font-size: 12px; }
    .lb-disc-crest-md { width: 48px; height: 48px; font-size: 17px; }

    .lb-disc-table-wrap { overflow-x: auto; }
    .lb-disc-table { width: 100%; border-collapse: collapse; min-width: 520px; }
    .lb-disc-table th { text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-dim); border-bottom: 1px solid var(--card-border); }
    .lb-disc-table td { padding: 12px; border-bottom: 1px solid var(--card-border); font-size: 14px; color: var(--ink); }
    .lb-disc-table tbody tr:last-child td { border-bottom: none; }
    .lb-disc-table tbody tr:hover { background: var(--hover-bg); }
    .lb-disc-col-pos { width: 56px; }
    .lb-disc-col-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .lb-disc-pos { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 8px; background: var(--chip-bg); color: var(--ink-dim); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .lb-disc-pos-1 { background: #E3B341; color: #3B2A06; }
    .lb-disc-pos-2 { background: #BFC5C9; color: #2B3236; }
    .lb-disc-pos-3 { background: #C98B5E; color: #3A2211; }
    .lb-disc-identity { display: flex; align-items: center; gap: 10px; }
    .lb-disc-name { font-weight: 600; color: var(--ink); }

    .lb-disc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .lb-disc-tile { border: 1px solid var(--card-border); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; transition: border-color 160ms ease; }
    .lb-disc-tile:hover { border-color: color-mix(in srgb, var(--teal-bright) 40%, var(--card-border)); }
    .lb-disc-tile h4 { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--ink); margin-top: 8px; }
    .lb-disc-tile-meta { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

    .lb-disc-btn { height: 42px; padding: 0 18px; border-radius: 11px; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-family: var(--sans); font-size: 14px; font-weight: 600; text-decoration: none; transition: background 160ms ease, transform 160ms ease; }
    .lb-disc-btn svg { width: 17px; height: 17px; }
    .lb-disc-btn-primary { background: var(--teal-bright); color: #fff; }
    .lb-disc-btn-primary:hover { background: var(--teal-deep); }
    .lb-disc-btn-ghost { background: transparent; color: var(--ink); border-color: var(--card-border); }
    .lb-disc-btn-ghost:hover { background: var(--hover-bg); }
    .lb-disc-btn-disabled { opacity: .45; cursor: not-allowed; background: var(--chip-bg); color: var(--ink-dim); }
    .lb-disc-btn:active:not(.lb-disc-btn-disabled) { transform: scale(0.98); }

    .lb-server-cta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .lb-server-tile { display: flex; flex-direction: column; }
    .lb-server-cta .lb-disc-btn { flex: 1; justify-content: center; min-width: 120px; }

    .lb-game-banner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .lb-game-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; box-shadow: var(--card-shadow); display: flex; flex-direction: column; transition: border-color 160ms ease, transform 160ms ease; }
    .lb-game-card:hover { border-color: color-mix(in srgb, var(--teal-bright) 40%, var(--card-border)); transform: translateY(-2px); }
    .lb-game-banner { position: relative; aspect-ratio: 460 / 215; background: var(--chip-bg) center/cover no-repeat; overflow: hidden; }
    .lb-game-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lb-game-banner-fallback { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, color-mix(in srgb, var(--teal-bright) 35%, var(--sand)), var(--chip-bg)); color: #fff; font-family: var(--serif); font-size: 28px; font-weight: 600; }
    .lb-game-banner-fallback svg { width: 36px; height: 36px; }
    .lb-game-card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .lb-game-card-body .lb-disc-btn { margin-top: auto; align-self: stretch; justify-content: center; }
    .lb-game-card-open {
      display: block; width: 100%; padding: 0; border: none; background: transparent; cursor: pointer; text-align: left;
    }
    .lb-game-card-title-btn {
      display: block; width: 100%; padding: 0; border: none; background: transparent; cursor: pointer; text-align: left; font: inherit; color: inherit;
    }
    .lb-game-card-title-btn h4 { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--ink); }

    .lb-game-modal {
      border: none; border-radius: 20px; padding: 0; width: min(560px, 94vw);
      max-height: 88vh; overflow: hidden; background: var(--card); color: var(--ink);
      box-shadow: 0 20px 60px rgba(15,35,30,0.28);
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0;
    }
    .lb-game-modal::backdrop { background: rgba(15,35,30,0.5); }
    .lb-game-modal-shell { display: flex; flex-direction: column; max-height: 88vh; }
    .lb-game-modal-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 18px 20px 12px; border-bottom: 1px solid var(--card-border); flex-shrink: 0;
    }
    .lb-game-modal-head h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .lb-game-modal-body { padding: 0 20px 22px; overflow-y: auto; }
    .lb-game-modal-loading { padding: 28px 4px; font-size: 14px; color: var(--ink-dim); }
    .lb-game-modal-banner {
      margin: 14px 0 12px; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 7;
      background: linear-gradient(135deg, #1a2e2f, #0f8f78 140%), var(--lb-hero-banner) center/cover;
    }
    .lb-game-modal-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lb-game-modal-meta { font-size: 13px; color: var(--ink-dim); margin-bottom: 16px; font-variant-numeric: tabular-nums; }
    .lb-game-modal-section { margin-top: 18px; }
    .lb-game-modal-section h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .lb-game-modal-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .lb-game-modal-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border: 1px solid var(--card-border); border-radius: 12px; background: var(--sand-soft);
    }
    .lb-game-modal-row-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .lb-game-modal-row-copy strong { font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-game-modal-row-copy span { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
    .lb-game-modal-join { width: auto; height: 34px; padding: 0 12px; font-size: 12.5px; flex-shrink: 0; }
    .lb-game-modal-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .lb-game-modal-avatar-fallback {
      display: inline-flex; align-items: center; justify-content: center; background: var(--teal-bright); color: #fff;
      font-size: 11px; font-weight: 700;
    }
    .lb-home-live .lb-live-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-dim); }
    .lb-disc-identity { display: inline-flex; align-items: center; gap: 8px; }

    .lb-disc-skeleton { display: flex; flex-direction: column; gap: 10px; }
    .lb-disc-skeleton span { display: block; height: 52px; border-radius: 14px; background: linear-gradient(90deg, var(--chip-bg) 25%, var(--hover-bg) 50%, var(--chip-bg) 75%); background-size: 200% 100%; animation: lb-disc-shimmer 1.4s ease-in-out infinite; }
    @keyframes lb-disc-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (max-width: 720px) {
      .lb-disc-head h2 { font-size: 25px; }
      .lb-disc-stats { grid-template-columns: 1fr; }
      .lb-disc-invite .lb-disc-btn { width: 100%; justify-content: center; }
    }

    /* ── Live Presence (Quién está jugando ahora) ────────────────────────────── */
    .lb-live-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .lb-live-head h2 { font-family: var(--serif); font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
    .lb-live-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--teal-bright); color: #fff; font-size: 12px; font-weight: 700; }
    .lb-live-badge.is-live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: lb-live-pulse 1.5s ease-in-out infinite; }
    @keyframes lb-live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .lb-live-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
    .lb-live-stat { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; box-shadow: var(--card-shadow); padding: 16px; display: flex; flex-direction: column; gap: 4px; }
    .lb-live-stat-icon { width: 32px; height: 32px; border-radius: 10px; background: var(--chip-bg); color: var(--teal-bright); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 4px; }
    .lb-live-stat-icon svg { width: 16px; height: 16px; }
    .lb-live-stat-value { font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.1; color: var(--ink); }
    .lb-live-stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-dim); }
    .lb-live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .lb-live-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; box-shadow: var(--card-shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: border-color 160ms ease, transform 160ms ease; }
    .lb-live-card:hover { border-color: color-mix(in srgb, var(--teal-bright) 40%, var(--card-border)); transform: translateY(-2px); }
    .lb-live-card-header { display: flex; align-items: center; gap: 10px; }
    .lb-live-game-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--chip-bg); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .lb-live-game-icon svg { width: 20px; height: 20px; color: var(--teal-bright); }
    .lb-live-game-name { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--ink); }
    .lb-live-community { font-size: 12px; color: var(--ink-dim); }
    .lb-live-players { display: flex; flex-direction: column; gap: 8px; }
    .lb-live-player { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--chip-bg); border-radius: 10px; transition: background 160ms ease; }
    .lb-live-player:hover { background: var(--hover-bg); }
    .lb-live-player-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .lb-live-player-avatar-fallback { width: 36px; height: 36px; border-radius: 50%; background: var(--teal-bright); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .lb-live-player-info { flex: 1; min-width: 0; }
    .lb-live-player-name { font-weight: 600; color: var(--ink); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-live-player-time { font-size: 11.5px; color: var(--ink-dim); }
    .lb-live-empty { text-align: center; padding: 40px 20px; color: var(--ink-dim); }
    .lb-live-empty svg { width: 64px; height: 64px; margin-bottom: 12px; opacity: 0.5; }
    .lb-live-empty p { font-size: 14px; }
    .lb-live-skeleton { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .lb-live-skeleton-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px; }
    .lb-live-skeleton-row { height: 16px; border-radius: 8px; background: linear-gradient(90deg, var(--chip-bg) 25%, var(--hover-bg) 50%, var(--chip-bg) 75%); background-size: 200% 100%; animation: lb-disc-shimmer 1.4s ease-in-out infinite; margin-bottom: 10px; }
    .lb-live-skeleton-row.short { width: 60%; }
    .lb-live-skeleton-row.medium { width: 80%; }
    .lb-live-skeleton-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(90deg, var(--chip-bg) 25%, var(--hover-bg) 50%, var(--chip-bg) 75%); background-size: 200% 100%; animation: lb-disc-shimmer 1.4s ease-in-out infinite; margin-bottom: 8px; }

    /* ── Live Games in Discover ─────────────────────────────────────────────── */
    .lb-live-tile { position: relative; }
    .lb-live-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; background: var(--clay); color: #fff; margin-right: 8px; vertical-align: middle; }
    .lb-live-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; font-size: 12px; color: var(--ink-dim); }
    .lb-live-tile .lb-disc-btn { margin-top: auto; width: 100%; justify-content: center; }
    .lb-live-tile .lb-disc-btn svg { width: 16px; height: 16px; }

    @media (max-width: 720px) {
      .lb-live-stats { grid-template-columns: 1fr; }
      .lb-live-grid { grid-template-columns: 1fr; }
    }

    /* ── Accesibilidad transversal ───────────────────────────────────────────
       Un solo anillo de foco para todo lo interactivo. Antes solo 7 reglas
       sueltas lo definian, asi que navegar con Tab dejaba controles sin
       indicador visible. `:focus-visible` no afecta el click con mouse. */
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
    textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--teal-bright);
      outline-offset: 2px;
      border-radius: 6px;
    }

    /* Respeta la preferencia del sistema de reducir movimiento: el shimmer del
       skeleton y los hover con translate son decorativos, no informativos. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="lb-shell lb-atmosphere">
      <aside class="lb-sidebar">
        <div class="lb-brand">
          <img src="/tierly/tierly-logo.png" alt="TIRLY" width="256" height="256" decoding="async" />
          <h1>TIRLY</h1>
        </div>
        <button id="lb-menu-toggle" class="lb-menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false"><span></span></button>
        <nav class="lb-nav" id="lb-nav"></nav>
        <div class="lb-sidebar-promo">
          <p id="lb-sidebar-promo-text"></p>
          <img src="/tierly/tierly-apoyado.png" alt="TIRLY" width="384" height="256" loading="lazy" decoding="async" />
        </div>
      </aside>
       <div class="lb-main">
         <div id="lb-admin-banner" class="lb-admin-banner" hidden role="region" aria-live="polite"></div>

        <section id="lb-ranking-view" class="lb-view" data-view="ranking">
          <div class="lb-stats" id="lb-stats"></div>
          <div class="lb-content-grid">
            <div class="lb-col-main">
              <div class="lb-leaderboard-card">
                <div class="lb-view-head">
                  <div>
                    <h2 id="lb-ranking-title"></h2>
                    <span id="lb-season-note" class="lb-season-note"></span>
                  </div>
                  <div class="lb-rank-controls">
                    <button id="lb-ranks-info-btn" type="button" class="lb-ranks-info-btn">
                      <i data-lucide="info"></i><span id="lb-ranks-info-btn-label"></span>
                    </button>
                    <div id="lb-rank-tabs" class="lb-rank-tabs"></div>
                    <input type="search" id="lb-player-search" class="lb-search-input" aria-label="Search player" autocomplete="off" />
                  </div>
                </div>
                <div id="lb-ranking" aria-label="ranking" style="flex:1; display:flex; flex-direction:column;"></div>
                <div id="lb-passport-results" class="lb-passport-results" hidden></div>
                <button id="lb-view-full" type="button"></button>
              </div>
            </div>
            <aside class="lb-col-side" id="lb-side"></aside>
          </div>
          <div class="lb-secondary-grid">
            <div class="lb-secondary-card">
              <h2 id="lb-upcoming-title"></h2>
              <div id="lb-upcoming"></div>
            </div>
            <div class="lb-secondary-card">
              <h2 id="lb-activity-title"></h2>
              <div id="lb-activity"></div>
            </div>
          </div>
        </section>

        <section class="lb-view" data-view="bracket" hidden>
          <h2 id="lb-bracket-title" class="lb-view-head"></h2>
          <p id="lb-events-notice" role="status" data-kind="" hidden></p>
          <div id="lb-bracket"></div>
        </section>

        <section class="lb-view" data-view="rewards" hidden>
          <h2 id="lb-rewards-title" class="lb-view-head"></h2>
          <div id="lb-rewards"></div>
        </section>

        <section class="lb-view" data-view="profile" hidden>
          <h2 id="lb-profile-title" class="lb-view-head" hidden></h2>
          <div id="lb-profile-banner" class="lb-profile-banner-full"><img id="lb-profile-banner-img" alt="" /></div>
          <div class="lb-profile-card">
            <div id="lb-profile-avatar" class="lb-profile-avatar-wrap"></div>
            <div id="lb-auth"></div>
            <div id="lb-profile-summary"></div>
